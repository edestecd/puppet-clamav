# This file can be used to install module dependencies for unit testing
# See https://github.com/puppetlabs/puppetlabs_spec_helper#using-fixtures for details
---
fixtures:
  forge_modules:
    # Keep the test fixture inside metadata.json's declared < 10.0.0 range.
    stdlib:
      repo: "puppetlabs/stdlib"
      ref: "9.7.0"
    # Pin the newest puppet/epel release that retains EL7 support while
    # remaining compatible with the module's Puppet 7 and Puppet 8 test matrix.
    epel:
      repo: "puppet/epel"
      ref: "5.0.0"
    # Extracted from core in puppet 6
    yumrepo_core: "puppetlabs/yumrepo_core"
  symlinks:
    clamav: "#{source_dir}"
